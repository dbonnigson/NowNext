name: NowNext
options:
  bundleIdPrefix: ai.palmettogroup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Xcode 26 "recommended settings" (keeps the prompt from coming back after xcodegen)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Set your Apple Developer Team ID here or in Xcode > Signing & Capabilities.
    DEVELOPMENT_TEAM: ""

targets:
  NowNext:
    type: application
    platform: iOS
    sources:
      - path: NowNext
        excludes:
          - "Resources/NowNext.storekit"
      - path: NowNext/Resources/NowNext.storekit
        buildPhase: none
      - path: Shared
    info:
      path: NowNext/Info.plist
      properties:
        CFBundleDisplayName: NowNext
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSCalendarsFullAccessUsageDescription: "NowNext shows your upcoming events as a countdown so you can see how much time you have. Your calendar is only read on this iPhone and never leaves it."
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: NowNext/NowNext.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.palmettogroup.nownext
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.palmettogroup.nownext
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: NowNextWidgets

  NowNextWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NowNextWidgets
      - path: Shared
    info:
      path: NowNextWidgets/Info.plist
      properties:
        CFBundleDisplayName: NowNext
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NowNextWidgets/NowNextWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.palmettogroup.nownext
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.palmettogroup.nownext.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES

  NowNextTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NowNextTests
    dependencies:
      - target: NowNext
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.palmettogroup.nownext.tests

schemes:
  NowNext:
    build:
      targets:
        NowNext: all
        NowNextTests: [test]
    run:
      config: Debug
      storeKitConfiguration: NowNext/Resources/NowNext.storekit
    test:
      config: Debug
      targets:
        - NowNextTests
    archive:
      config: Release
